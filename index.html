<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 포켓몬 찾기</title>
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #FFFDF0 0%, #FEF3C7 100%);
            color: #4A3B32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 640px;
            background-color: #FFFFFF;
            border-radius: 28px;
            box-shadow: 0 12px 32px rgba(217, 119, 6, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);
            padding: 32px 24px;
            text-align: center;
            border: 4px solid #FDE68A;
            transition: all 0.3s ease;
        }

        /* 헤더 스타일 */
        header {
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            background-color: #FEF3C7;
            color: #B45309;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid #FDE68A;
        }

        h1 {
            font-size: 2.1rem;
            color: #78350F;
            margin-bottom: 10px;
            word-break: keep-all;
            line-height: 1.3;
        }

        p.subtitle {
            font-size: 1.05rem;
            color: #92400E;
            word-break: keep-all;
            line-height: 1.5;
        }

        /* MBTI 그리드 스타일 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .container {
                padding: 24px 16px;
            }
            h1 {
                font-size: 1.75rem;
            }
        }

        .mbti-btn {
            background-color: #FFFDF0;
            border: 2px solid #FDE68A;
            border-radius: 18px;
            padding: 16px 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(245, 158, 11, 0.05);
        }

        .mbti-btn:hover {
            transform: translateY(-4px) scale(1.03);
            background-color: #FEF3C7;
            border-color: #F59E0B;
            box-shadow: 0 8px 15px rgba(245, 158, 11, 0.2);
        }

        .mbti-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .mbti-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #B45309;
        }

        .mbti-desc {
            font-size: 0.8rem;
            color: #D97706;
            margin-top: 4px;
            font-weight: 600;
        }

        /* 결과 화면 스타일 */
        .result-card {
            display: none;
            animation: fadeInScale 0.4s ease-out forwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .pokemon-tag {
            background-color: #F59E0B;
            color: #FFFFFF;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .pokemon-title {
            font-size: 2.2rem;
            color: #78350F;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .pokemon-emoji {
            font-size: 6.5rem;
            line-height: 1.1;
            margin: 10px 0 20px 0;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0 8px 12px rgba(217, 119, 6, 0.2));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .reason-box {
            background-color: #FFFDF0;
            border: 2px dashed #FDE68A;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .reason-box h3 {
            font-size: 1.1rem;
            color: #B45309;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reason-box p {
            font-size: 1.05rem;
            color: #573B28;
            line-height: 1.6;
            word-break: keep-all;
        }

        /* 환상의 궁합 박스 */
        .match-box {
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            border: 2px solid #F59E0B;
        }

        .match-info h4 {
            font-size: 0.9rem;
            color: #B45309;
            margin-bottom: 4px;
        }

        .match-info .match-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #78350F;
        }

        .match-emoji {
            font-size: 2.8rem;
        }

        /* 다시 고르기 버튼 */
        .retry-btn {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 20px;
            padding: 16px 36px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3);
            transition: all 0.2s ease;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.4);
            background: linear-gradient(135deg, #FBBF24 0%, #D97706 100%);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #B45309;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 메인 헤더 -->
        <header id="mainHeader">
            <span class="badge">🎮 MBTI 포켓몬 테스트</span>
            <h1>나와 닮은 포켓몬 찾기</h1>
            <p class="subtitle">나의 MBTI 유형을 선택하면 가장 잘 어울리는 포켓몬 친구를 소개해 드려요!</p>
        </header>

        <!-- MBTI 선택 그리드 -->
        <div class="grid-container" id="mbtiGrid">
            <!-- 자바스크립트로 동적 생성 -->
        </div>

        <!-- 결과 카드 (초기 숨김) -->
        <div class="result-card" id="resultCard">
            <div id="pokemonTag" class="pokemon-tag">칭호</div>
            <h2 id="pokemonTitle" class="pokemon-title">포켓몬 이름</h2>
            <div id="pokemonEmoji" class="pokemon-emoji">🐢</div>
            
            <div class="reason-box">
                <h3>💡 왜 이 포켓몬일까요?</h3>
                <p id="pokemonReason">어울리는 이유 설명 글이 들어갑니다.</p>
            </div>

            <div class="match-box">
                <div class="match-info">
                    <h4>💖 환상의 찰떡 궁합</h4>
                    <div id="matchText" class="match-name">ENFP - 피카츄 ⚡</div>
                </div>
                <div id="matchEmoji" class="match-emoji">⚡</div>
            </div>

            <button class="retry-btn" onclick="resetSelection()">🔄 다시 고르기</button>
        </div>

    </div>

    <footer>
        <p>✨ 나만의 MBTI 포켓몬 파트너를 찾아보세요! ✨</p>
    </footer>

    <script>

        const mbtiData = {

            "INTP": {

                emoji: "🧠",
                reason: "느긋해 보이지만 머릿속에서는 끝없는 지적 호기심과 논리적 탐구가 이어지고 있습니다. 누구도 생각지 못한 기발한 아이디어와 이론으로 주변을 놀라게 합니다.",
                matchMbti: "ENTJ",
                matchName: "한카리아스",
                matchEmoji: "🦈"
            },
            "ESTP": {
                name: "윈디",
                title: "모험을 즐기는 스피디한 행동파",
                emoji: "🦁",
                reason: "망설임 없이 도전하며 에너지가 넘쳐흐르는 열정적인 모험가입니다. 어떤 난관이 찾아와도 시원시원한 스피드와 자신감 넘치는 태도로 극복해 냅니다.",
                matchMbti: "ISFJ",
                matchName: "해피너스",
                matchEmoji: "💖"
            },
            "ESFP": {
                name: "푸린",
                title: "분위기를 밝히는 사랑둥이",
                emoji: "🎤",
                reason: "어디서나 스포트라이트를 받으며 통통 튀는 흥과 매력을 발산합니다. 특유의 기분 좋은 에너지로 주변 분위기를 순식간에 환하게 밝혀주는 슈퍼스타입니다.",
                matchMbti: "ISTJ",
                matchName: "거북왕",

            },
            "ENFP": {

                matchMbti: "INTJ",
                matchName: "뮤츠",
                matchEmoji: "🔮"
            },
            "ENTP": {
                name: "로토무",

                emoji: "👻",
                reason: "새로운 사물과 아이디어에 호기심이 가득한 재치꾼입니다. 번뜩이는 기발함과 색다른 관점으로 규칙을 유쾌하게 비틀며 늘 새로움을 추구합니다.",
                matchMbti: "INFJ",
                matchName: "뮤",
                matchEmoji: "✨"
            },
            "ESTJ": {
                name: "리자몽",
                title: "거침없이 이끄는 강력한 리더",
                emoji: "🐉",
                reason: "확확 태워버리는 강력한 화력처럼 명확한 목표와 강한 추진력을 자랑합니다. 솔선수범하여 조직을 체계적으로 이끌고 탁월한 결과를 도출해 냅니다.",
                matchMbti: "ISFP",
                matchName: "메타몽",
                matchEmoji: "🫠"
            },
            "ESFJ": {
                name: "망나뇽",
                title: "살뜰하고 친절한 배려왕",

                matchMbti: "ISTP",
                matchName: "루카리오",
                matchEmoji: "🐺"
            },
            "ENFJ": {
                name: "토게키스",
                title: "희망과 기쁨을 주는 지도자",
                emoji: "🕊️",
                reason: "사람들의 가능성을 이끌어내고 다 함께 행복해지는 길을 찾아가는 따뜻한 멘토입니다. 사랑과 평화의 기운을 퍼뜨리며 주변을 긍정적으로 변화시킵니다.",
                matchMbti: "INFP",
                matchName: "이브이",
                matchEmoji: "🦊"
            },
            "ENTJ": {
                name: "한카리아스",
                title: "확고한 비전의 치밀한 승부사",
                emoji: "🦈",
                reason: "매서운 눈빛과 거침없는 속도로 비전을 현실로 만들어내는 치밀한 야망가입니다. 높은 목표를 향해 주저 없이 돌진하며 전략적으로 승리를 쟁취합니다.",
                matchMbti: "INTP",
                matchName: "야도킹",
                matchEmoji: "🧠"
            }
        };

        // MBTI 버튼 생성 함수
        function renderMbtiButtons() {
            const grid = document.getElementById('mbtiGrid');
            grid.innerHTML = '';

            Object.keys(mbtiData).forEach(mbti => {
                const btn = document.createElement('button');
                btn.className = 'mbti-btn';
                btn.onclick = () => showResult(mbti);

                const title = document.createElement('span');
                title.className = 'mbti-title';
                title.textContent = mbti;

                const desc = document.createElement('span');
                desc.className = 'mbti-desc';
                desc.textContent = mbtiData[mbti].name;

                btn.appendChild(title);
                btn.appendChild(desc);
                grid.appendChild(btn);
            });
        }

        // 결과 표시 함수
        function showResult(mbti) {
            const data = mbtiData[mbti];
            if (!data) return;

            // UI 스위칭
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('mbtiGrid').style.display = 'none';

            // 데이터 채우기
            document.getElementById('pokemonTag').textContent = `${mbti} · ${data.title}`;
            document.getElementById('pokemonTitle').textContent = `${data.name}`;
            document.getElementById('pokemonEmoji').textContent = data.emoji;
            document.getElementById('pokemonReason').textContent = data.reason;

            // 궁합 데이터 채우기
            document.getElementById('matchText').textContent = `${data.matchMbti} (${data.matchName})`;
            document.getElementById('matchEmoji').textContent = data.matchEmoji;

            // 카드 표시
            const resultCard = document.getElementById('resultCard');
            resultCard.style.display = 'block';

            // 화면 최상단으로 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 다시 고르기 함수
        function resetSelection() {
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'block';
            document.getElementById('mbtiGrid').style.display = 'grid';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 초기화 실행
        window.onload = function() {
            renderMbtiButtons();
        };
    </script>
</body>
</html>
